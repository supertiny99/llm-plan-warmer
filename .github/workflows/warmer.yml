name: Universal LLM & Coding Plan Warmer

on:
  schedule:
    # 每小时的第 33 分钟自动轮询评估 (由 warmer.py 根据各供应商的 trigger_hours 决定是否真正执行预热)
    - cron: '33 * * * *'
  workflow_dispatch: # 支持在 GitHub Web 界面手动触发

jobs:
  warmer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Universal Warmer
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          ZHIPU_ACCOUNTS: ${{ secrets.ZHIPU_ACCOUNTS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_BASE_URL: ${{ secrets.ZHIPU_BASE_URL }}
          ZHIPU_MODEL: ${{ secrets.ZHIPU_MODEL }}
        run: |
          python warmer.py
