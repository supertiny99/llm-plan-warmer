name: Universal LLM & Coding Plan Warmer

on:
  schedule:
    # 预热锚点为北京时间 08:10 / 13:30 / 18:50，相邻间隔 5h20m：
    # 每 20 分钟缓冲确保上一窗口 (5 小时) 已过期，锚点必定开出新窗口，消除整点竞态。
    # GitHub Actions 的 cron 使用 UTC (北京时间 = UTC+8)：
    - cron: '10 0 * * *'   # UTC 00:10 = 北京 08:10 → 开窗 08:10-13:10，覆盖上午工作段 8:30-11:30 (全 1x)
    - cron: '30 5 * * *'   # UTC 05:30 = 北京 13:30 → 开窗 13:30-18:30，下午工作段 13:30-17:30 满血开局
    - cron: '50 10 * * *'  # UTC 10:50 = 北京 18:50 → 开窗 18:50-23:50，出峰 (18:00) 后晚间满血 (全 1x)
    # 锚点刻意避开工作日 14:00-18:00 峰时三倍消耗时段；
    # 若账号配置了其他 trigger_hours，需在此同步增加对应的 cron 行 (UTC 时间)。
  workflow_dispatch: # 支持在 GitHub Web 界面手动触发

jobs:
  warmer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Universal Warmer
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          ZHIPU_ACCOUNTS: ${{ secrets.ZHIPU_ACCOUNTS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_BASE_URL: ${{ secrets.ZHIPU_BASE_URL }}
          ZHIPU_MODEL: ${{ secrets.ZHIPU_MODEL }}
        run: |
          python warmer.py
