name: Universal LLM & Coding Plan Warmer

on:
  schedule:
    # 对应的北京时间为工作日 (周一至周五): 05:33, 10:33, 15:33, 20:33
    - cron: '33 21 * * 0-4'
    - cron: '33 2,7,12 * * 1-5'
  workflow_dispatch: # 支持在 GitHub Web 界面手动触发

jobs:
  warmer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Universal Warmer
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          ZHIPU_ACCOUNTS: ${{ secrets.ZHIPU_ACCOUNTS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_BASE_URL: ${{ secrets.ZHIPU_BASE_URL }}
          ZHIPU_MODEL: ${{ secrets.ZHIPU_MODEL }}
        run: |
          python warmer.py
