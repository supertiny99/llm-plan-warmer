name: Universal LLM & Coding Plan Warmer

on:
  schedule:
    # 预热锚点为北京时间 07:20 / 12:40 / 18:00 / 23:20，相邻间隔 5h20m：
    # 每 20 分钟缓冲确保上一窗口 (5 小时) 已过期，锚点必定开出新窗口，消除整点竞态。
    # GitHub Actions 的 cron 使用 UTC (北京时间 = UTC+8)：
    - cron: '20 23 * * *'  # UTC 23:20 = 北京 07:20 (次日) → 开窗 07:20-12:20，覆盖上午工作段 8:30-11:30 (全 1x)
    - cron: '40 4 * * *'   # UTC 04:40 = 北京 12:40 → 开窗 12:40-17:40，覆盖下午工作段 13:30-17:30；12:40-14:00 全 1x 可前置批量任务
    - cron: '00 10 * * *'  # UTC 10:00 = 北京 18:00 → 开窗 18:00-23:00，出峰整点即满血 (全 1x)
    - cron: '20 15 * * *'  # UTC 15:20 = 北京 23:20 → 开窗 23:20-04:20，接住晚间窗口 23:00 过期后的夜间刷新
    # 锚点刻意避开工作日 14:00-18:00 峰时三倍消耗时段；结构性空洞仅剩 04:20-07:20 (清晨)。
    # 夜间锚点已是最早可行值: 晚间锚点下限为出峰时刻 18:00，加 5h20m 间隔即 23:20。
    # 若账号配置了其他 trigger_hours，需在此同步增加对应的 cron 行 (UTC 时间)。
  workflow_dispatch: # 支持在 GitHub Web 界面手动触发

jobs:
  warmer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Universal Warmer
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          ZHIPU_ACCOUNTS: ${{ secrets.ZHIPU_ACCOUNTS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_BASE_URL: ${{ secrets.ZHIPU_BASE_URL }}
          ZHIPU_MODEL: ${{ secrets.ZHIPU_MODEL }}
        run: |
          python warmer.py
